# Omarchy Quattro Nord palette; terminal is kitty.

font = JetBrainsMono Nerd Font:size=13
prompt = "  "
placeholder = search
icon-theme = breeze-dark
icons-enabled = yes
terminal = kitty
lines = 12
width = 48
horizontal-pad = 16
vertical-pad = 10
inner-pad = 6
line-height = 22
tabs = 4
fields = filename,name,generic,keywords,comment
match-mode = fzf
sort-result = yes
show-actions = no
exit-on-keyboard-focus-loss = yes
anchor = center
layer = overlay

[colors]
background = 191c23ff
text = d8dee9ff
prompt = 81a1c1ff
placeholder = 667080ff
input = d8dee9ff
match = 81a1c1ff
selection = 434c5eff
selection-text = d8dee9ff
selection-match = d8dee9ff
border = 81a1c1ff
counter = 667080ff

[border]
width = 2
radius = 2

[dmenu]
exit-immediately-if-empty = yes
