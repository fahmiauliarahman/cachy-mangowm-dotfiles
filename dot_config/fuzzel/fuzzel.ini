# Zeibytes dark blue, squared. Terminal is kitty.

font = JetBrainsMono Nerd Font:size=13
prompt = "  "
placeholder = search
icon-theme = breeze-dark
icons-enabled = yes
terminal = kitty
lines = 12
width = 48
horizontal-pad = 16
vertical-pad = 10
inner-pad = 6
line-height = 22
tabs = 4
fields = filename,name,generic,keywords,comment
match-mode = fzf
sort-result = yes
show-actions = no
exit-on-keyboard-focus-loss = yes
anchor = center
layer = overlay

[colors]
background = 101520ee
text = d1dae8ff
prompt = 89b4faff
placeholder = 6c7e97ff
input = e0e8f0ff
match = 89b4faff
selection = 6c7e97ff
selection-text = 101520ff
selection-match = 101520ff
border = 89b4faff
counter = 6c7e97ff

[border]
width = 2
radius = 8

[dmenu]
exit-immediately-if-empty = yes
