# Dark blue, square, fish. Matches the mango rice.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.5

shell            fish
confirm_os_window_close 0
background_opacity 0.92
window_padding_width 10
hide_window_decorations yes
dynamic_background_opacity no
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
enable_audio_bell no
remember_window_size no
initial_window_width 90c
initial_window_height 28c

foreground            #d1dae8
background            #101520
selection_foreground  #101520
selection_background  #6c7e97
cursor                #89b4fa
cursor_text_color     #101520

color0  #1a222e
color1  #ad401f
color2  #8fba7c
color3  #e6c07b
color4  #6c7e97
color5  #b153a7
color6  #89b4fa
color7  #d1dae8
color8  #2a3648
color9  #e06c75
color10 #a3d39c
color11 #f0d090
color12 #89b4fa
color13 #c678dd
color14 #9fd4ff
color15 #e0e8f0

active_tab_foreground   #101520
active_tab_background   #6c7e97
inactive_tab_foreground #d1dae8
inactive_tab_background #1a222e

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+equal   change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
