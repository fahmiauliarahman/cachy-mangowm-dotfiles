# Omarchy Quattro Nord palette; square, opaque-leaning terminal surfaces.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.5

shell            fish
confirm_os_window_close 0
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/mango-kitty-{kitty_pid}
background_opacity 0.92
window_padding_width 10
hide_window_decorations yes
dynamic_background_opacity no
cursor_shape block
cursor_blink_interval 0
scrollback_lines 10000
enable_audio_bell no
remember_window_size no
initial_window_width 90c
initial_window_height 28c

foreground            #d8dee9
background            #191c23
selection_foreground  #d8dee9
selection_background  #434c5e
cursor                #81a1c1
cursor_text_color     #191c23

color0  #222730
color1  #bf616a
color2  #a3be8c
color3  #ebcb8b
color4  #81a1c1
color5  #b48ead
color6  #88c0d0
color7  #d8dee9
color8  #4c566a
color9  #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #88c0d0
color15 #adb5c4

active_tab_foreground   #191c23
active_tab_background   #81a1c1
inactive_tab_foreground #d8dee9
inactive_tab_background #222730

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+equal   change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0
