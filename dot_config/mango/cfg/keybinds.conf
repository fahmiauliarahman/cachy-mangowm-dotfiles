# | Keybinds |
# MangoWM-native Omarchy Quattro workflow; Super+K lists all bindings.

# --- Launch ---
bind = SUPER, Return, spawn, kitty
bind = SUPER+CTRL, Return, spawn_shell, kitty fish -c herdr
bind = SUPER+SHIFT, Return, spawn, helium-browser
bind = SUPER+SHIFT+ALT, B, spawn, helium-browser --incognito
bind = SUPER+SHIFT, F, spawn, dolphin
bind = SUPER+SHIFT, N, spawn_shell, kitty fish -c nvim
bind = SUPER+SHIFT, T, spawn_shell, kitty fish -c btop
bind = SUPER+SHIFT, Q, spawn, qalc

# --- Menus and desktop controls ---
bind = SUPER, Space, spawn, fuzzel
bind = SUPER+ALT, Space, spawn, fuzzel
bind = SUPER, Escape, spawn, ~/.config/mango/scripts/power.sh
bind = SUPER, K, spawn, ~/.config/mango/scripts/keys.py
bindl = SUPER+CTRL, L, spawn, ~/.config/mango/scripts/power.sh lock
bind = SUPER+CTRL, C, spawn, ~/.config/mango/scripts/capture.sh
bind = SUPER, V, spawn, ~/.config/mango/scripts/clip.py
bind = SUPER+CTRL, A, spawn, pavucontrol
bind = SUPER+CTRL, B, spawn, ~/.config/mango/scripts/radios.py bluetooth
bind = SUPER+CTRL, N, spawn, ~/.config/mango/scripts/radios.py wifi
bind = SUPER+CTRL, P, spawn, ~/.config/mango/scripts/power.sh
bind = SUPER+CTRL, V, spawn, ~/.config/mango/scripts/clip.py
bind = SUPER+CTRL, T, spawn, ~/.config/mango/scripts/theme.py
bind = SUPER+CTRL, W, spawn, ~/.config/mango/scripts/wallpaper.sh next
bind = SUPER+SHIFT, Space, spawn_shell, pkill -x waybar || waybar

# --- Close ---
bind = SUPER, Q, killclient,
bind = SUPER, W, killclient,
bind = CTRL+ALT, Delete, spawn_shell, mmsg dispatch killclient

# --- Window state ---
bind = SUPER, T, togglefloating,
bind = SUPER, F, togglefullscreen,
bind = SUPER+ALT, F, togglemaximizescreen,
bind = SUPER+CTRL, F, togglefakefullscreen,
bind = SUPER, O, toggleoverlay,
bind = SUPER, G, toggleglobal,
bind = SUPER, S, toggle_scratchpad,
bind = SUPER+ALT, S, minimized,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, J, dwindle_toggle_split_direction,
bind = SUPER, BackSpace, toggle_render_border,
bind = SUPER+SHIFT, BackSpace, togglegaps,
bind = ALT, Tab, focusstack, next
bind = ALT+SHIFT, Tab, focusstack, prev
bind = SUPER, Tab, viewtoright, 0
bind = SUPER+SHIFT, Tab, viewtoleft, 0
bind = SUPER+CTRL, Tab, view, -1, 0

# --- Layouts: tile, scroller, dwindle ---
bind = SUPER, L, spawn, ~/.config/mango/scripts/layout.sh next
bind = SUPER+ALT, L, spawn, ~/.config/mango/scripts/layout.sh prev
bind = SUPER, N, switch_layout,
bind = SUPER, minus, setmfact, -0.05
bind = SUPER, equal, setmfact, +0.05
bind = SUPER+ALT, minus, resizewin, -20, +0
bind = SUPER+ALT, equal, resizewin, +20, +0
bind = SUPER+SHIFT, minus, resizewin, +0, -20
bind = SUPER+SHIFT, equal, resizewin, +0, +20
bind = SUPER+CTRL, minus, resizewin, -80, +0
bind = SUPER+CTRL, equal, resizewin, +80, +0
bind = SUPER, X, switch_proportion_preset,
bind = SUPER, E, set_proportion, 1.0
bind = SUPER, P, set_proportion, 0.8

# --- Focus and swap ---
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = CTRL+ALT, Left, focusmon, left
bind = CTRL+ALT, Right, focusmon, right
bind = CTRL+ALT+SHIFT, Left, focusmon, prev
bind = CTRL+ALT+SHIFT, Right, focusmon, next

# --- Workspaces 1-9 ---
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0
bind = SUPER+SHIFT+ALT, 1, tagsilent, 1
bind = SUPER+SHIFT+ALT, 2, tagsilent, 2
bind = SUPER+SHIFT+ALT, 3, tagsilent, 3
bind = SUPER+SHIFT+ALT, 4, tagsilent, 4
bind = SUPER+SHIFT+ALT, 5, tagsilent, 5
bind = SUPER+SHIFT+ALT, 6, tagsilent, 6
bind = SUPER+SHIFT+ALT, 7, tagsilent, 7
bind = SUPER+SHIFT+ALT, 8, tagsilent, 8
bind = SUPER+SHIFT+ALT, 9, tagsilent, 9

# --- Monitors ---
bind = SUPER+SHIFT+CTRL, Left, tagmon, left
bind = SUPER+SHIFT+CTRL, Right, tagmon, right
bind = SUPER+SHIFT+CTRL, Up, tagmon, up
bind = SUPER+SHIFT+CTRL, Down, tagmon, down
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right

# --- Reload ---
bind = SUPER, R, reload_config,

# --- Gaps ---
bind = SUPER+SHIFT, X, incgaps, 1
bind = SUPER+SHIFT, Z, incgaps, -1

# --- Floating move / resize ---
bind = CTRL+SHIFT, Up, movewin, +0, -40
bind = CTRL+SHIFT, Down, movewin, +0, +40
bind = CTRL+SHIFT, Left, movewin, -40, +0
bind = CTRL+SHIFT, Right, movewin, +40, +0
bind = CTRL+ALT, Up, resizewin, +0, -40
bind = CTRL+ALT, Down, resizewin, +0, +40

# --- Mouse and scroll ---
mousebind = SUPER, btn_left, moveresize, curmove
mousebind = SUPER, btn_right, moveresize, curresize
mousebind = NONE, btn_middle, togglemaximizescreen, 0
axisbind = SUPER, UP, viewtoleft_have_client
axisbind = SUPER, DOWN, viewtoright_have_client

# --- Trackpad ---
gesturebind = none, left, 3, focusdir, left
gesturebind = none, right, 3, focusdir, right
gesturebind = none, up, 3, focusdir, up
gesturebind = none, down, 3, focusdir, down
gesturebind = none, right, 4, viewtoleft_have_client
gesturebind = none, left, 4, viewtoright_have_client

# --- Media. wpctl / brightnessctl / playerctl ---
bind = NONE, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = NONE, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = ALT, XF86AudioRaiseVolume, spawn, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 1%+
bind = ALT, XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bind = NONE, XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = SHIFT, XF86AudioMute, spawn_shell, wpctl set-default $(wpctl status | awk '/Sinks:/,/Sources:/ { if ($2 ~ /^[0-9]+/) print $2 }' | head -1)
bind = NONE, XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = NONE, XF86AudioPlay, spawn, playerctl play-pause
bind = NONE, XF86AudioNext, spawn, playerctl next
bind = NONE, XF86AudioPrev, spawn, playerctl previous
bind = ALT, XF86AudioPlay, spawn, playerctl next
bind = ALT+SHIFT, XF86AudioPlay, spawn, playerctl previous
bind = NONE, XF86MonBrightnessUp, spawn, brightnessctl set 5%+
bind = NONE, XF86MonBrightnessDown, spawn, brightnessctl set 5%-
bind = SHIFT, XF86MonBrightnessUp, spawn, brightnessctl set 100%
bind = SHIFT, XF86MonBrightnessDown, spawn, brightnessctl set 1%
bind = ALT, XF86MonBrightnessUp, spawn, brightnessctl set 1%+
bind = ALT, XF86MonBrightnessDown, spawn, brightnessctl set 1%-

# --- Capture ---
bind = NONE, Print, spawn, ~/.config/mango/scripts/screenshot.sh region
bind = SUPER+CTRL+ALT, C, spawn, ~/.config/mango/scripts/screenshot.sh region
bind = SUPER, Print, spawn, ~/.config/mango/scripts/screenshot.sh color

# --- Notifications ---
bind = SUPER+ALT, comma, spawn, makoctl dismiss
bind = SUPER+SHIFT, comma, spawn, makoctl dismiss -a
bind = SUPER+SHIFT+ALT, comma, spawn, makoctl restore
bind = SUPER+CTRL+ALT, comma, spawn, makoctl mode -t do-not-disturb
