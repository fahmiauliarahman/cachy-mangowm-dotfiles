# | Auto Start |
# MangoWM-native session services.

exec_once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP
exec_once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP
exec_once = ~/.config/mango/scripts/wallpaper.sh
exec_once = waybar
exec_once = mako
exec_once = wl-paste --type text --watch cliphist store
exec_once = wl-paste --type image --watch cliphist store
