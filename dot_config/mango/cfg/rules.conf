# | Rules |

window_rule = is_floating:1, app_id:[Ss]team
window_rule = is_floating:0, title:Steam
window_rule = is_floating:1, app_id:steam, title:Steam Settings
window_rule = is_floating:1, app_id:pavucontrol
window_rule = is_floating:1, app_id:blueman-manager
window_rule = is_floating:1, app_id:nm-connection-editor
window_rule = is_floating:1, title:^(Picture-in-Picture)$
window_rule = is_floating:1, app_id:org.gnome.Calculator
window_rule = is_floating:1, app_id:galculator

layer_rule = no_animation:1, no_blur:1, layer_name:selection
layer_rule = animation_type_open:zoom, animation_type_close:zoom, layer_name:fuzzel
layer_rule = animation_type_open:zoom, animation_type_close:zoom, layer_name:wlogout
